name: Document Verification Workflow

 

on:

  push:

    branches:

      - main

  repository_dispatch:

    types: [submit-form]

 

jobs:

  verify-and-send:

    runs-on: ubuntu-latest

   

    # 📂 defaults와 run의 들여쓰기 공백을 완벽하게 맞췄습니다.

    defaults:

      run:

        working-directory: ./backend

 

    steps:

      - name: Checkout repository code

        uses: actions/checkout@v4

 

      - name: Set up Node.js environment

        uses: actions/setup-node@v4

        with:

          node-version: '18'

 

      - name: Install dependencies

        run: npm install

 

      # ⚠️ 중요: 서버를 실제로 띄우면 무한대기하므로, 문법적인 오류가 없는지(node -c) 검사만 수행하고 정상 종료합니다.

      - name: Run Code Syntax Verification

        run: |

          node -c server.js

          node -c verify.js

 

