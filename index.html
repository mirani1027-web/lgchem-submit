<!doctype html>

<html lang="ko">

<head>

  <meta charset="utf-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>LG화학 여수공장 유해화학물질 도급신고 제출 양식</title>

  <style>

    *{box-sizing:border-box}

    body{margin:0;min-width:1080px;font-family:Arial,"Malgun Gothic",sans-serif;color:#0f172a;background:linear-gradient(135deg,#f8fafc,#fff 45%,#eff6ff)}

    .wrap{max-width:1280px;margin:0 auto;padding:16px 32px 92px}

    .hero{background:#0f172a;color:#fff;border-radius:16px;padding:14px 22px;box-shadow:0 10px 28px rgba(15,23,42,.18);margin-bottom:16px}

    .hero-inner{display:flex;align-items:center;justify-content:space-between;gap:16px}

    .hero-left{flex:1;min-width:0}

    h1{margin:0;font-size:19px;line-height:1.3}

    .hero p{color:#cbd5e1;margin:5px 0 0;font-size:12px;line-height:1.5}

    .bar-box{margin-top:8px;max-width:240px}

    .bar-top{display:flex;justify-content:space-between;font-size:11px;color:#dbeafe;margin-bottom:4px}

    .bar{height:5px;border-radius:999px;overflow:hidden;background:rgba(255,255,255,.18)}

    .bar-fill{height:100%;width:0;background:#60a5fa;transition:width .2s}

    .serial-box{display:inline-flex;flex-direction:column;align-items:flex-end;background:#1e3a8a;border-radius:12px;padding:8px 14px;white-space:nowrap}

    .serial-label{font-size:10px;color:#93c5fd;font-weight:700;margin-bottom:3px}

    .serial-val{color:#fff;font-size:15px;font-weight:900;letter-spacing:1px}

    .grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}

    .card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:18px 20px;box-shadow:0 4px 14px rgba(15,23,42,.06)}

    .side-card{position:sticky;top:14px;max-height:calc(100vh - 96px);overflow:auto}

    .card h2{margin:0 0 14px;font-size:15px;color:#0f172a}

    .sec-title{font-size:14px;font-weight:900;color:#1e3a8a;padding:5px 10px;background:#eff6ff;border-left:3px solid #2563eb;border-radius:0 8px 8px 0;margin:0 0 11px}

    .sec-divider{height:1px;background:#f1f5f9;margin:15px 0}

    .sub-label{font-size:11px;font-weight:900;color:#475569;display:flex;align-items:center;gap:5px;margin:12px 0 8px}

    .sub-label-bar{display:inline-block;width:3px;height:12px;border-radius:2px}

    .row{display:grid;gap:10px;margin-bottom:10px}

    .row:last-child{margin-bottom:0}

    .col-3{grid-template-columns:repeat(3,minmax(0,1fr))}

    .col-4{grid-template-columns:repeat(4,minmax(0,1fr))}

    .col-2-1{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}

    .col-1-1-2{grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,2fr)}

    .col-2-1-1{grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr)}

    label{display:block}

    .label-row{display:flex;align-items:center;gap:4px;margin-bottom:4px;font-size:11px;font-weight:700;color:#334155}

    .req{color:#ef4444}

    input,textarea{width:100%;border:1px solid #cbd5e1;border-radius:9px;padding:7px 9px;font-size:12px;font-family:inherit;outline:none;background:white}

    input:focus,textarea:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.1)}

    input.error,textarea.error{border-color:#ef4444}

    .error-text{display:none;color:#dc2626;font-size:10px;font-weight:700;margin-top:3px}

    .error-text.show{display:block}

    .help{position:relative;display:inline-flex;width:14px;height:14px;align-items:center;justify-content:center;border:1px solid #cbd5e1;border-radius:50%;color:#475569;background:white;font-size:9px;cursor:help;flex-shrink:0}

    .help:hover:after{content:attr(data-help);position:absolute;left:50%;top:18px;transform:translateX(-50%);z-index:20;width:260px;padding:8px;border-radius:9px;background:#0f172a;color:#fff;font-size:10px;font-weight:500;line-height:1.5;white-space:pre-line;box-shadow:0 8px 20px rgba(15,23,42,.25)}

    .sales-wrap{position:relative}

    .sales-wrap input{padding-right:22px}

    .sales-unit{position:absolute;right:8px;top:50%;transform:translateY(-50%);color:#64748b;font-size:11px;pointer-events:none}

    .readonly-field{background:#f1f5f9 !important;color:#475569 !important}

    .steps-wrap{margin-top:12px;padding:11px;border:1px solid #e2e8f0;background:#f8fafc;border-radius:12px}

    .steps-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}

    .step-count{color:#64748b;font-size:10px;margin-top:2px}

    .step{background:white;border:1px solid #e2e8f0;border-radius:10px;padding:8px;margin-top:6px}

    .step-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}

    .step-num{color:#1d4ed8;font-weight:800;font-size:12px}

    .step-grid{display:grid;grid-template-columns:180px minmax(0,1fr);gap:7px}

    .step textarea{min-height:44px;font-size:11px}

    .step input{font-size:11px}

    .safety-wrap{margin-top:10px;padding:11px;border:1px solid #e2e8f0;background:#f8fafc;border-radius:12px}

    .file-grid{display:grid;gap:8px}

    .file-group{border:1px solid #dbeafe;background:#f8fbff;border-radius:12px;padding:9px}

    .file-group-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;padding-bottom:5px;border-bottom:1px solid #e0ecff;color:#1e40af;font-size:11px;font-weight:900}

    .file-group-count{color:#64748b;font-size:10px;font-weight:700}

    .file-group-items{display:grid;gap:6px}

    .file-box{border:1px solid #e2e8f0;border-radius:9px;padding:7px;background:white}

    .file-title{font-size:11px;font-weight:800;margin-bottom:4px;display:flex;gap:4px;align-items:center;flex-wrap:wrap}

    .file-rule{font-size:10px;color:#64748b;margin-bottom:4px}

    .download-link{margin-left:auto;color:#1d4ed8;border:1px solid #bfdbfe;background:#eff6ff;border-radius:999px;padding:2px 6px;font-size:10px;font-weight:800;text-decoration:none}

    .employment-note{margin-bottom:4px;color:#64748b;font-size:10px;line-height:1.4}

    .file-box input[type=file]{padding:6px;border-style:dashed;background:#f8fafc;font-size:10px}

    .file-name{margin-top:4px;color:#16a34a;font-size:10px;font-weight:700;display:none;word-break:break-all}

    .file-name.show{display:block}

    .message{display:none;border-radius:11px;padding:10px 13px;margin-bottom:13px;font-size:12px;line-height:1.6}

    .message.show{display:block}

    .message.ok{border:1px solid #bbf7d0;background:#f0fdf4;color:#166534}

    .message.bad{border:1px solid #fde68a;background:#fffbeb;color:#92400e}

    .bottom{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);width:min(1224px,calc(100% - 64px));background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border:1px solid #e2e8f0;border-radius:16px;padding:9px 14px;box-shadow:0 10px 32px rgba(15,23,42,.14);display:flex;align-items:center;justify-content:space-between;gap:12px}

    .bottom p{margin:0;color:#64748b;font-size:11px}

    .btns{display:flex;gap:7px}

    button{border:0;border-radius:9px;padding:8px 15px;font-size:12px;font-weight:800;cursor:pointer;font-family:inherit}

    .btn-primary{background:#1d4ed8;color:white}

    .btn-primary:disabled{opacity:.5;cursor:not-allowed}

    .btn-outline{background:white;color:#334155;border:1px solid #cbd5e1}

    .btn-sm{padding:5px 9px;font-size:11px}

    .btn-danger{color:#dc2626;background:#fff;border:1px solid #fecaca}

    .btn-danger:disabled{opacity:.35;cursor:not-allowed}

  </style>

</head>

<body>

<div class="wrap">

 

  <div class="hero">

    <div class="hero-inner">

      <div class="hero-left">

        <h1>(주)LG화학 여수공장 유해화학물질 도급신고 제출 양식</h1>

        <p>작성내용과 첨부파일을 제출하면 담당자 이메일로 자동 전송됩니다. 첫 제출 시 서버 기동으로 시간이 걸릴 수 있습니다.</p>

        <div class="bar-box">

          <div class="bar-top"><span>작성 완료율</span><strong id="progressText">0%</strong></div>

          <div class="bar"><div class="bar-fill" id="progressBar"></div></div>

        </div>

      </div>

      <div>

        <div class="serial-box">

          <span class="serial-label">제출 일련번호</span>

          <span class="serial-val" id="serialDisplay">-</span>

        </div>

      </div>

    </div>

  </div>

 

  <div class="message" id="message"></div>

 

  <form id="submitForm" novalidate>

    <input type="hidden" id="keyValue" name="keyValue"/>

    <input type="hidden" id="groupId" name="groupId" value="G01"/>

    <input type="hidden" id="token" name="token" value="TEST_TOKEN"/>

    <input type="hidden" id="workStepsJson" name="workStepsJson"/>

    <input type="hidden" id="attachmentChecklist" name="attachmentChecklist"/>

    <input type="hidden" id="serialNumber" name="serialNumber"/>

    <input type="hidden" id="mailSubject" name="mailSubject"/>

    <input type="hidden" id="mainPhoneFormatted" name="mainPhoneFormatted"/>

    <input type="hidden" id="businessRegNoFormatted" name="businessRegNoFormatted"/>

    <input type="hidden" id="submitterPhoneFormatted" name="submitterPhoneFormatted"/>

    <input type="hidden" id="safetyManagerPhoneFormatted" name="safetyManagerPhoneFormatted"/>

    <input type="hidden" id="salesAmountFormatted" name="salesAmountFormatted"/>

 

    <div class="grid">

      <section class="card">

        <div class="sec-title">🏢 협력업체 기본정보</div>

        <div class="row col-3">

          <label>

            <div class="label-row">업체명 <span class="req">*</span></div>

            <input id="companyName" name="companyName" required placeholder="예: ○○산업">

            <div class="error-text" id="companyNameError"></div>

          </label>

          <label>

            <div class="label-row">대표자 <span class="req">*</span></div>

            <input id="ceoName" name="ceoName" required placeholder="대표자 성명">

            <div class="error-text" id="ceoNameError"></div>

          </label>

          <label>

            <div class="label-row">대표번호 <span class="req">*</span><span class="help" data-help="숫자만 입력하면 자동으로 변환됩니다.">!</span></div>

            <input id="mainPhone" name="mainPhone" required placeholder="예: 0610000000" inputmode="numeric" maxlength="20">

            <div class="error-text" id="mainPhoneError"></div>

          </label>

        </div>

        <div class="row col-2-1-1">

          <label>

            <div class="label-row">사업장 주소 <span class="req">*</span></div>

            <input id="businessAddress" name="businessAddress" required placeholder="예: 경남 창원시 성산구 공단로21번길 28">

            <div class="error-text" id="businessAddressError"></div>

          </label>

          <label>

            <div class="label-row">설립연도 <span class="req">*</span></div>

            <input id="establishYear" name="establishYear" required inputmode="numeric" maxlength="4" placeholder="예: 1999">

            <div class="error-text" id="establishYearError"></div>

          </label>

          <label>

            <div class="label-row">사업자등록번호 <span class="req">*</span><span class="help" data-help="숫자만 입력하면 자동으로 변환됩니다.">!</span></div>

            <input id="businessRegNo" name="businessRegNo" required placeholder="예: 0000000000" inputmode="numeric" maxlength="12">

            <div class="error-text" id="businessRegNoError"></div>

          </label>

        </div>

        <div class="row col-4">

          <label>

            <div class="label-row">사업분야 <span class="req">*</span></div>

            <input id="businessField" name="businessField" required placeholder="예: 건설업, 고압가스 냉동기기 제조 외">

            <div class="error-text" id="businessFieldError"></div>

          </label>

          <label>

            <div class="label-row">업종 <span class="req">*</span></div>

            <input id="businessType" name="businessType" required placeholder="예: 화학제품 제조업">

            <div class="error-text" id="businessTypeError"></div>

          </label>

          <label>

            <div class="label-row">주요 생산품 <span class="req">*</span></div>

            <input id="mainProduct" name="mainProduct" required placeholder="예: 폴리에틸렌">

            <div class="error-text" id="mainProductError"></div>

          </label>

          <label>

            <div class="label-row">매출액 <span class="help" data-help="숫자만 입력하세요.">!</span></div>

            <div class="sales-wrap">

              <input id="salesAmount" name="salesAmount" inputmode="numeric" placeholder="예: 1000000000">

              <span class="sales-unit">원</span>

            </div>

          </label>

        </div>

        <div class="sub-label">

          <span class="sub-label-bar" style="background:#2563eb;"></span>

          제출자 정보 (업체 담당자)

        </div>

        <div class="row col-3">

          <label>

            <div class="label-row">이름 <span class="req">*</span></div>

            <input id="submitterName" name="submitterName" required placeholder="성명">

            <div class="error-text" id="submitterNameError"></div>

          </label>

          <label>

            <div class="label-row">전화번호 <span class="req">*</span><span class="help" data-help="숫자만 입력하면 자동으로 변환됩니다.">!</span></div>

            <input id="submitterPhone" name="submitterPhone" required placeholder="예: 01000000000" inputmode="numeric" maxlength="15">

            <div class="error-text" id="submitterPhoneError"></div>

          </label>

          <label>

            <div class="label-row">이메일 <span class="req">*</span></div>

            <input id="submitterEmail" name="submitterEmail" type="email" required placeholder="예: manager@partner.com">

            <div class="error-text" id="submitterEmailError"></div>

          </label>

        </div>

        <div class="sec-divider"></div>

        <div class="sec-title">⚙️ 도급 작업 정보</div>

        <div class="row col-2-1">

          <label>

            <div class="label-row">도급내용(계약서명) <span class="req">*</span></div>

            <input id="contractTitle" name="contractTitle" required placeholder="계약서명 또는 도급 작업명">

            <div class="error-text" id="contractTitleError"></div>

          </label>

          <label>

            <div class="label-row">공사시작 예정일 <span class="req">*</span><span class="help" data-help="오늘 기준 최소 3일 이후 날짜만 선택 가능합니다.">!</span></div>

            <input id="contractStart" name="contractStart" required type="date">

            <div class="error-text" id="contractStartError"></div>

          </label>

        </div>

        <div class="row col-1-1-2">

          <label>

            <div class="label-row">작업인원 <span class="req">*</span></div>

            <input id="workerCount" name="workerCount" required type="number" min="1" placeholder="예: 5">

            <div class="error-text" id="workerCountError"></div>

          </label>

          <label>

            <div class="label-row">취급물질 <span class="req">*</span></div>

            <input id="handlingMaterials" name="handlingMaterials" required placeholder="자동 입력" readonly class="readonly-field">

            <div class="error-text" id="handlingMaterialsError"></div>

          </label>

          <label>

            <div class="label-row">취급공정/취급시설 <span class="req">*</span></div>

            <input id="handlingProcess" name="handlingProcess" required placeholder="자동 입력" readonly class="readonly-field">

            <div class="error-text" id="handlingProcessError"></div>

          </label>

        </div>

        <div class="steps-wrap">

          <div class="steps-head">

            <div>

              <div class="label-row" style="margin-bottom:0;">작업절차 <span class="req">*</span><span class="help" data-help="최소 5단계 이상, 각 단계는 작업명과 세부내용을 모두 입력해 주세요.">!</span></div>

              <div class="step-count" id="stepCount">완료 0개 / 최소 5개 · 0자 / 최소 200자</div>

            </div>

            <button type="button" class="btn-outline btn-sm" id="addStepBtn">+ 단계 추가</button>

          </div>

          <div id="steps"></div>

          <div class="error-text" id="stepsError"></div>

        </div>

        <div class="safety-wrap">

          <div class="sub-label" style="margin:0 0 8px;">

            <span class="sub-label-bar" style="background:#0d9488;"></span>

            안전관리자

          </div>

          <div class="row col-3">

            <label>

              <div class="label-row">이름 <span class="req">*</span></div>

              <input id="safetyManagerName" name="safetyManagerName" required placeholder="성명">

              <div class="error-text" id="safetyManagerNameError"></div>

            </label>

            <label>

              <div class="label-row">직책 <span class="req">*</span></div>

              <input id="safetyManagerPosition" name="safetyManagerPosition" required placeholder="예: 과장">

              <div class="error-text" id="safetyManagerPositionError"></div>

            </label>

            <label>

              <div class="label-row">전화번호 <span class="req">*</span><span class="help" data-help="숫자만 입력하면 자동으로 변환됩니다.">!</span></div>

              <input id="safetyManagerPhone" name="safetyManagerPhone" required placeholder="예: 01000000000" inputmode="numeric" maxlength="15">

              <div class="error-text" id="safetyManagerPhoneError"></div>

            </label>

          </div>

        </div>

      </section>

 

      <section class="card side-card">

        <h2>첨부파일 <span class="help" data-help="구역별로 서류를 각각 첨부해 주세요. 확약서는 자동연장 조항 해당 시 첨부해 주세요.">?</span></h2>

        <p style="color:#64748b;font-size:11px;margin:0 0 10px;">교육이수증은 별도 메일로 분리 발송됩니다.</p>

        <div class="file-grid" id="fileGrid"></div>

      </section>

    </div>

 

    <div class="bottom">

      <p>제출 시 작성내용과 첨부파일이 담당자 이메일로 전송됩니다.</p>

      <div class="btns">

        <button type="button" class="btn-outline" id="resetBtn">초기화</button>

        <button type="submit" class="btn-primary" id="submitBtn">제출</button>

      </div>

    </div>

  </form>

</div>

 

<script>

const MATERIAL_PROCESS_MAP = {

  HC:  {material:"시안 등 00종",   process:"㈜엘지화학_화치단지 유해화학물질 취급 전 공정"},

  YS1: {material:"벤젠 등 00종",   process:"㈜엘지화학_용성1단지 유해화학물질 취급 전 공정"},

  YS2: {material:"벤젠 등 00종",   process:"㈜엘지화학_용성2단지 유해화학물질 취급 전 공정"},

  YS:  {material:"벤젠 등 40종",   process:"㈜엘지화학_용성단지 유해화학물질 취급 전 공정"},

  SM:  {material:"스티렌 등 00종", process:"㈜엘지화학_SM단지 유해화학물질 취급 전 공정"},

  VCM: {material:"염소 등 00종",   process:"㈜엘지화학_VCM단지 유해화학물질 취급 전 공정"}

};

 

const requiredFields = [

  ["companyName","업체명"],

  ["ceoName","대표자"],

  ["mainPhone","대표번호"],

  ["businessRegNo","사업자등록번호"],

  ["businessType","업종"],

  ["mainProduct","주요 생산품"],

  ["establishYear","설립연도"],

  ["businessAddress","사업장 주소"],

  ["businessField","사업분야"],

  ["contractTitle","도급내용(계약서명)"],

  ["workerCount","작업인원"],

  ["contractStart","공사시작 예정일"],

  ["handlingMaterials","취급물질"],

  ["handlingProcess","취급공정/취급시설"],

  ["submitterName","제출자 이름"],

  ["submitterPhone","제출자 전화번호"],

  ["submitterEmail","제출자 이메일"],

  ["safetyManagerName","안전관리자 이름"],

  ["safetyManagerPosition","안전관리자 직책"],

  ["safetyManagerPhone","안전관리자 전화번호"]

];

 

const attachmentItems = [

  {key:"businessLicense",       label:"사업자등록증",        required:true,  maxMB:1,  ext:["jpg","jpeg","png"], note:"이미지, 최대 1MB"},

  {key:"vatCertificate",        label:"부가가치세표준증명원", required:true,  maxMB:1,  ext:["jpg","jpeg","png"], note:"이미지, 최대 1MB"},

  {key:"contract",              label:"계약서",               required:true,  maxMB:5,  ext:["pdf"],              note:"PDF, 최대 5MB"},

  {key:"pledge",                label:"확약서",               required:false, maxMB:1,  ext:["pdf"],              note:"PDF, 최대 1MB / 자동연장 조항 해당 시"},

  {key:"manpowerList",          label:"수급인인력명세서",     required:true,  maxMB:1,  ext:["pdf"],              note:"PDF, 최대 1MB", dl:"./forms/manpower_list_form.pdf"},

  {key:"trainingCertificate",   label:"교육이수증",           required:true,  maxMB:20, ext:["pdf","zip"],        note:"PDF 또는 ZIP, 최대 20MB"},

  {key:"employmentCertificate", label:"재직증명서",           required:true,  maxMB:1,  ext:["pdf"],              note:"PDF, 최대 1MB"},

  {key:"ppeList",               label:"보호구명세서",         required:true,  maxMB:1,  ext:["pdf"],              note:"PDF, 최대 1MB", dl:"./forms/ppe_list_form.pdf"},

  {key:"ppeCertificate",        label:"보호구인증서",         required:true,  maxMB:5,  ext:["pdf","zip"],        note:"PDF 또는 ZIP, 최대 5MB"}

];

 

const attachmentGroups = [

  {title:"사업자 관련 서류 (양식용)", keys:["businessLicense","vatCertificate"]},

  {title:"계약 관련 서류",            keys:["contract","pledge"]},

  {title:"인력·교육 관련 서류",       keys:["manpowerList","trainingCertificate","employmentCertificate"]},

  {title:"보호구 관련 서류",          keys:["ppeList","ppeCertificate"]}

];

 

let steps = [{title:"",detail:""},{title:"",detail:""},{title:"",detail:""},{title:"",detail:""},{title:"",detail:""}];

 

function pad(n){return String(n).padStart(2,"0")}

function formatDate(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}

function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}

 

const today = new Date();

today.setHours(0,0,0,0);

const minStart = formatDate(addDays(today,3));

const startInput = document.getElementById("contractStart");

startInput.min = minStart;

 

function fmtPhone(d){

  if(!d) return d;

  if(d.startsWith("02")){

    return d.length<=9 ? d.replace(/(\d{2})(\d{3,4})(\d{0,4})/,"$1-$2-$3").replace(/-$/,"") : d.replace(/(\d{2})(\d{4})(\d{4})/,"$1-$2-$3");

  }

  return d.length<=10 ? d.replace(/(\d{3})(\d{3,4})(\d{0,4})/,"$1-$2-$3").replace(/-$/,"") : d.replace(/(\d{3})(\d{4})(\d{4})/,"$1-$2-$3");

}

function fmtBiz(d){

  return d.length<=10 ? d.replace(/(\d{3})(\d{2})(\d{0,5})/,"$1-$2-$3").replace(/-$/,"") : d.substring(0,10).replace(/(\d{3})(\d{2})(\d{5})/,"$1-$2-$3");

}

function setupPhone(id,type){

  document.getElementById(id).addEventListener("input",function(){

    const r = this.value.replace(/\D/g,"");

    this.value = type==="biz" ? fmtBiz(r.substring(0,10)) : fmtPhone(r.substring(0,11));

    updateProgress();

  });

}

setupPhone("mainPhone","phone");

setupPhone("businessRegNo","biz");

setupPhone("submitterPhone","phone");

setupPhone("safetyManagerPhone","phone");

 

document.getElementById("establishYear").addEventListener("input",function(){

  this.value = this.value.replace(/\D/g,"").substring(0,4);

  updateProgress();

});

 

document.getElementById("salesAmount").addEventListener("input",function(){

  this.value = this.value.replace(/\D/g,"");

  updateProgress();

});

 

function buildSubject(){

  const sn = document.getElementById("serialNumber").value || "-";

  const co = document.getElementById("companyName").value.trim() || "업체명";

  const now = new Date();

  return "["+sn+"] 유해화학물질 취급시설 도급신고 자료제출("+co+"_"+now.getFullYear()+pad(now.getMonth()+1)+pad(now.getDate())+")";

}

function updateMailSubject(){

  document.getElementById("mailSubject").value = buildSubject();

}

function updateSerial(){

  updateMailSubject();

}

 

document.getElementById("companyName").addEventListener("input", updateMailSubject);

 

function renderFiles(){

  const map = Object.fromEntries(attachmentItems.map(i=>[i.key,i]));

  document.getElementById("fileGrid").innerHTML = attachmentGroups.map(g=>{

    const items = g.keys.map(k=>map[k]).filter(Boolean);

    const cnt = items.filter(i=>i.required).length;

    return '<div class="file-group">'

      +'<div class="file-group-title"><span>'+g.title+'</span><span class="file-group-count">필수 '+cnt+'건</span></div>'

      +'<div class="file-group-items">'+items.map(it=>{

        return '<div class="file-box">'

          +'<div class="file-title"><span>'+it.label+'</span>'

          +(it.required ? '<span class="req">*</span>' : '<span style="color:#94a3b8;font-size:10px;">선택</span>')

          +(it.dl ? '<a class="download-link" href="'+it.dl+'" download target="_blank">⬇ 양식</a>' : '')

          +'</div>'

          +'<div class="file-rule">'+it.note+'</div>'

          +(it.key==="employmentCertificate" ? '<div class="employment-note">작업인원에 대해 한 장의 재직증명서로 제출하세요.</div>' : '')

          +'<input type="file" id="'+it.key+'" name="'+it.key+'" accept="'+it.ext.map(e=>'.'+e).join(',')+'" '+(it.required?"data-req='1'":"")+'/>'

          +'<div class="file-name" id="'+it.key+'Nm"></div>'

          +'<div class="error-text" id="'+it.key+'Error"></div>'

          +'</div>';

      }).join('')

      +'</div></div>';

  }).join("");

 

  attachmentItems.forEach(it=>{

    const el = document.getElementById(it.key);

    if(el){

      el.addEventListener("change",function(){

        const nm = document.getElementById(it.key+"Nm");

        if(this.files && this.files[0]){

          nm.textContent = "첨부됨: "+this.files[0].name+" ("+(this.files[0].size/1024/1024).toFixed(2)+"MB)";

          nm.classList.add("show");

        } else {

          nm.textContent = "";

          nm.classList.remove("show");

        }

        updateProgress();

      });

    }

  });

}

 

function esc(s){

  return String(s).replace(/[&<>'"]/g,function(c){

    return {"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c];

  });

}

 

function renderSteps(){

  document.getElementById("steps").innerHTML = steps.map(function(s,i){

    return '<div class="step">'

      +'<div class="step-top">'

      +'<span class="step-num">'+(i+1)+'단계</span>'

      +'<button type="button" class="btn-danger btn-sm" onclick="removeStep('+i+')" '+(steps.length<=5?"disabled":"")+'>삭제</button>'

      +'</div>'

      +'<div class="step-grid">'

      +'<input value="'+esc(s.title)+'" placeholder="'+(i===0?'작업 전 준비':'')+'" oninput="chgStep('+i+',\'title\',this.value)">'

      +'<textarea rows="2" placeholder="'+(i===0?'1. 보호구 착용&#10;2. 고령자/음주자 체크&#10;3. 5분 멈춤':'')+'" oninput="chgStep('+i+',\'detail\',this.value)">'+esc(s.detail)+'</textarea>'

      +'</div>'

      +'</div>';

  }).join("");

  updateStepCount();

}

 

window.chgStep = function(i,f,v){ steps[i][f]=v; updateStepCount(); updateProgress(); };

window.removeStep = function(i){ if(steps.length<=5) return; steps.splice(i,1); renderSteps(); updateProgress(); };

 

document.getElementById("addStepBtn").addEventListener("click",function(){

  steps.push({title:"",detail:""});

  renderSteps();

  updateProgress();

});

 

function doneSteps(){ return steps.filter(function(s){return s.title.trim()&&s.detail.trim();}).length; }

function stepLen(){ return steps.map(function(s,i){return (i+1)+s.title+s.detail;}).join("").replace(/\s/g,"").length; }

function updateStepCount(){

  document.getElementById("stepCount").textContent = "완료 "+doneSteps()+"개 / 최소 5개 · "+stepLen()+"자 / 최소 200자";

}

 

function showErr(id,msg){

  const el = document.getElementById(id);

  const er = document.getElementById(id+"Error");

  if(el) el.classList.add("error");

  if(er){ er.textContent=msg; er.classList.add("show"); }

}

function clearErrors(){

  document.querySelectorAll(".error").forEach(function(e){e.classList.remove("error");});

  document.querySelectorAll(".error-text").forEach(function(e){e.textContent="";e.classList.remove("show");});

  const m = document.getElementById("message");

  if(m){ m.className="message"; m.textContent=""; }

}

 

function validate(){

  clearErrors();

  const missing = [];

  requiredFields.forEach(function(item){

    const id = item[0], lb = item[1];

    const el = document.getElementById(id);

    if(!el || !el.value.trim()){ showErr(id, lb+"을(를) 입력해 주세요."); missing.push(lb); }

  });

  const yr = document.getElementById("establishYear").value.trim();

  if(yr && (yr.length!==4 || isNaN(yr))){

    showErr("establishYear","연도 4자리를 입력해 주세요. 예: 1999");

    missing.push("설립연도 형식 오류");

  }

  if(startInput.value && startInput.value < minStart){

    showErr("contractStart","오늘 기준 3일 이후부터 선택 가능합니다.");

    missing.push("공사시작 예정일 오류");

  }

  if(doneSteps()<5){

    const e = document.getElementById("stepsError");

    e.textContent = "완료된 단계가 최소 5단계 이상이어야 합니다.";

    e.classList.add("show");

    missing.push("작업절차 5단계");

  }

  if(stepLen()<200){

    const e = document.getElementById("stepsError");

    e.textContent += " 최소 200자 이상 작성해 주세요. (현재 "+stepLen()+"자)";

    e.classList.add("show");

    missing.push("작업절차 200자");

  }

  const em = document.getElementById("submitterEmail").value.trim();

  if(em && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){

    showErr("submitterEmail","올바른 이메일 형식을 입력해 주세요.");

    missing.push("제출자 이메일 형식");

  }

  attachmentItems.forEach(function(it){

    const f = document.getElementById(it.key);

    const file = f && f.files && f.files[0];

    if(it.required && !file){

      const e = document.getElementById(it.key+"Error");

      e.textContent = it.label+"을(를) 첨부해 주세요.";

      e.classList.add("show");

      missing.push(it.label);

      return;

    }

    if(file){

      const ext = file.name.split('.').pop().toLowerCase();

      if(!it.ext.includes(ext)){

        const e = document.getElementById(it.key+"Error");

        e.textContent = "허용 확장자: "+it.ext.join(', ');

        e.classList.add("show");

        missing.push(it.label+" 확장자");

      }

      if(file.size > it.maxMB*1024*1024){

        const e = document.getElementById(it.key+"Error");

        e.textContent = "최대 "+it.maxMB+"MB까지 가능합니다.";

        e.classList.add("show");

        missing.push(it.label+" 용량");

      }

    }

  });

  return missing;

}

 

function updateHidden(){

  document.getElementById("workStepsJson").value = JSON.stringify(steps.map(function(s,i){return {step:i+1,title:s.title,detail:s.detail};}));

  document.getElementById("attachmentChecklist").value = attachmentItems.map(function(i){

    const f = document.getElementById(i.key);

    return i.label+": "+(f && f.files && f.files[0] ? f.files[0].name : '미첨부');

  }).join('\n');

  document.getElementById("mainPhoneFormatted").value = document.getElementById("mainPhone").value;

  document.getElementById("businessRegNoFormatted").value = document.getElementById("businessRegNo").value;

  document.getElementById("submitterPhoneFormatted").value = document.getElementById("submitterPhone").value;

  document.getElementById("safetyManagerPhoneFormatted").value = document.getElementById("safetyManagerPhone").value;

  const s = document.getElementById("salesAmount").value.trim();

  document.getElementById("salesAmountFormatted").value = s ? (Number(s).toLocaleString()+"원") : "";

  updateMailSubject();

}

 

function updateProgress(){

  const cf = requiredFields.filter(function(item){

    const e = document.getElementById(item[0]);

    return e && e.value.trim();

  }).length;

  const rf = attachmentItems.filter(function(i){return i.required;});

  const cf2 = rf.filter(function(i){

    const e = document.getElementById(i.key);

    return e && e.files && e.files.length>0;

  }).length;

  const ss = (doneSteps()>=5 && stepLen()>=200) ? 1 : 0;

  const pct = Math.round(((cf+cf2+ss)/(requiredFields.length+rf.length+1))*100);

  document.getElementById("progressText").textContent = pct+"%";

  document.getElementById("progressBar").style.width = pct+"%";

}

 

document.getElementById("submitForm").addEventListener("input", updateProgress);

 

document.getElementById("submitForm").addEventListener("submit", async function(e){

  e.preventDefault();

  const missing = validate();

  const msg = document.getElementById("message");

  if(missing.length){

    msg.className = "message bad show";

    msg.textContent = "미작성/미첨부/오류: "+missing.join(", ");

    window.scrollTo({top:0,behavior:"smooth"});

    return;

  }

  updateHidden();

  const btn = document.getElementById("submitBtn");

  btn.disabled = true;

  btn.textContent = "제출 중...";

  msg.className = "message ok show";

  msg.textContent = "제출 처리 중입니다. 첫 제출 시 서버 기동으로 최대 1분 소요될 수 있습니다. 창을 닫지 마세요.";

  try{

    const fd = new FormData(document.getElementById("submitForm"));

    const res = await fetch("https://lgchem-submit.onrender.com/submit",{method:"POST",body:fd});

    const data = await res.json().catch(function(){return {};});

    if(!res.ok || !data.ok) throw new Error(data.message || "제출 실패");

    msg.className = "message ok show";

    msg.textContent = "제출 완료! 접수번호: "+(data.receiptId || "확인 필요");

  } catch(err){

    msg.className = "message bad show";

    msg.textContent = "오류: "+err.message;

  } finally{

    btn.disabled = false;

    btn.textContent = "제출";

    window.scrollTo({top:0,behavior:"smooth"});

  }

});

 

document.getElementById("resetBtn").addEventListener("click",function(){

  document.getElementById("submitForm").reset();

  steps = [{title:"",detail:""},{title:"",detail:""},{title:"",detail:""},{title:"",detail:""},{title:"",detail:""}];

  clearErrors();

  renderSteps();

  renderFiles();

  updateProgress();

  initPage();

});

 

startInput.addEventListener("change", updateProgress);

 

function initPage(){

  const p = new URLSearchParams(window.location.search);

  const id = p.get('id');

  const comp = p.get('comp');

 

  if(id){

    const kv = document.getElementById("keyValue");

    if(kv) kv.value = id;

    const sn = document.getElementById("serialNumber");

    if(sn) sn.value = id;

    const sd = document.getElementById("serialDisplay");

    if(sd) sd.textContent = id;

 

    const parts = id.split('-');

    if(parts.length >= 2){

      const code = parts[1].toUpperCase();

      const m = MATERIAL_PROCESS_MAP[code];

      if(m){

        const hm = document.getElementById("handlingMaterials");

        const hp = document.getElementById("handlingProcess");

        if(hm) hm.value = m.material;

        if(hp) hp.value = m.process;

      }

    }

  }

 

  if(comp){

    const el = document.getElementById("companyName");

    if(el){

      el.value = comp;

      el.readOnly = true;

      el.classList.add("readonly-field");

    }

  }

 

  renderFiles();

  renderSteps();

  updateProgress();

  updateMailSubject();

}

 

initPage();

</script>
